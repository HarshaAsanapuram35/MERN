<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
        body {
            background: #3c3a3a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            background: #c9c2c2;
            border-radius: 8px;
            padding: 30px;
            width: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            color: orange;
        }
        .input-container {
            display: flex;
            justify-content: space-between;
            margin: 10px 0; /* Corrected margin */
        }
        input {
            padding: 10px;
            border: 1px solid white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .firstname, .lastname {
            width: 48%; /* Set width for side-by-side inputs */
        }
        .emailandpassword {
            margin: 10px 0; /* Space above and below */
        }
        .emailandpassword input {
            width: 100%; /* Full width for email and password inputs */
            margin-top: 10px; /* Space above email and password inputs */
        }
        button {
            background: #07b048;
            color: #ffffff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%; /* Set button width to 100% */
            transition: background 0.4s;
        }
        button:hover {
            background: #eda916;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Login</h1>
        <form>
            <div class="input-container">
                <input type="text" class="firstname" placeholder="Firstname" required />
                <input type="text" class="lastname" placeholder="Lastname" required />
            </div>
            <div class="emailandpassword">
                <input type="email" placeholder="Email" required />
                <input type="password" placeholder="Password" required />
            </div>
            <button type="submit">Click me!</button>
        </form>
    </div>
</body>
</html>
