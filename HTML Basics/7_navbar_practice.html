<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav bar practive</title>
    <style>
        h1{
            background: #cf2a2a;
            color: aliceblue;
            width: 80%;
        }
        .nav-containner{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .nav1 ul{
            list-style-type: none;
            padding-left: 0%;
            border-bottom: 0%;
            background-color: rgb(229, 200, 54);
            display: block;
            width: 200px;
            border-radius: 5px;
            
        }
        .nav1 li{
            margin-bottom: 12px;
            margin-left: 10px;
            
        }
        .nav1 a{
            text-decoration: none;
            color: white;
        }
        .nav1 a:hover{
            background: #475504;
            
        }
        button{
            background-color: rgba(0, 166, 255, 0.87);
            color: aliceblue;
            border-radius: 5px;
            margin-left: 10px;
            cursor: pointer;
            width: 100px;
            height: 30px;
            border-color: aliceblue;
        }
    </style>
  </head>
  <body>
    <div class="nav-containner">
      <h1>This is a nav bar practice</h1>
      <nav class="nav1">
        <ul>
          <li><a href="">Home</a></li>
          <li><a href="">about</a></li>
          <li><a href="">Products</a></li>
          <li><a href="">User</a></li>
        </ul>
        <button class="button-bt">Click Me!</button>
      </nav>
    </div>
  </body>
</html>
