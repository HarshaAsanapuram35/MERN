<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      .class1{
        grid-row: span;
      }
      body {
        background: #3c3a3a;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .card {
        background: #c9c2c2;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      h1 {
        text-align: center;
        color: #ff7300;
      }
      .input-container{
        display: flex; /* Use flexbox for side-by-side layout */
        justify-content: space-between; /* Space between inputs */
        margin: 10px 0; /* Space above and below */
      }
      input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .firstname,
      .lastname {
        width: 48%; /* Set width for side-by-side inputs */
      }
      .emailandpassword{
        margin: 10px 0; /* Space above and below */
      }
      .emailandpassword{
        width: 100%; /* Full width for email and password inputs */
      }
      button {
        background: #f59402;
        color: #fff;
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background 0.4s;
      }
      button:hover {
        background: #caa309;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Login</h1>
      <form>
        <div class="input-container">
          <input
            class="firstname"
            type="text"
            placeholder="Firstname"
            aria-label="Firstname"
            required
          />
          <input
            class="lastname"
            type="text"
            placeholder="Lastname"
            aria-label="Lastname"
            required
          />
        </div>
        <div class="emailandpassword">
          <input
            type="email"
            id="email"
            placeholder="Email"
            aria-label="Email"
            required
          />
          <input
            type="password"
            id="password"
            placeholder="Password"
            aria-label="Password"
            required
          />
        </div>
        <button type="submit">Click me!</button>
      </form>
    </div>
  </body>
</html>
