<!-- 3. Flexbox
Flexbox (Flexible Box Layout) is a layout model that allows you to design a complex layout structure in a more efficient and predictable way than traditional models. 
It is particularly useful for aligning items in a row or column.

Example: -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Example</title>
    <style>
        .flex-container {
            display: flex;
            justify-content: space-around; /* Align items with space between */
            background-color: lightgray;
            padding: 10px;
        }
        .flex-item {
            background-color: lightcoral;
            padding: 20px;
            margin: 5px;
            flex: 5; /* Grow to fill space */
        }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
        <div class="flex-item">Item 4</div>
        <div class="flex-item">Item 5</div>
    </div>
</body>
</html>
